# Render Blueprint — VetFlow cloud pilot (ADR-0021).
#
# One web service, built from the existing pilot Dockerfile. The API serves the
# Angular bundle same-origin (Program.cs pilot hosting block), so there is no
# second service and no CORS configuration — exactly as on-premise.
#
# The database is NOT declared here: PostgreSQL is hosted on Neon (ADR-0021),
# not on Render. Its connection string is supplied as a secret env var.
#
# Deploy: Render Dashboard → New → Blueprint → point at this repository.
services:
  - type: web
    name: vetflow
    runtime: docker
    dockerfilePath: ./src/VetFlow.Api/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: starter

    # ADR-0021 §Consequences 4: `ApplyMigrationsAtStartup` is true, so two
    # instances starting together would race on the same schema. Exactly one
    # instance until migrations move to a release step.
    numInstances: 1

    # The SPA index is served at "/" and returns 200 once the app is up. There is
    # no dedicated health endpoint yet; if one is added, point this at it.
    healthCheckPath: /

    envVars:
      # ADR-0021 §Consequences 9: the .NET container listens on 8080, but Render
      # health-checks $PORT (default 10000). Pinning PORT to 8080 aligns them.
      - key: PORT
        value: 8080

      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Explicit rather than relying on the base image's default, so the port the
      # app binds and the port Render routes to are pinned in one place.
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"

      # Neon connection string — set in the Render dashboard, never committed.
      #
      #   Host=<project>.<region>.aws.neon.tech;Database=<db>;Username=<user>;
      #   Password=<password>;SSL Mode=Require
      #
      # Npgsql keyword syntax — NOT the postgresql:// URI Neon shows you; Npgsql
      # cannot parse a URI. And do NOT add `Trust Server Certificate`: Npgsql 10
      # removed that keyword and throws `Couldn't set trust server certificate`
      # at startup (verified against this deployment, 2026-08-02). Since Npgsql 8
      # the libpq semantics apply — `SSL Mode=Require` encrypts without verifying
      # the certificate, which is what that keyword used to be paired with.
      # `SSL Mode=VerifyFull` is the hardening step once a deploy is green.
      # Drop `channel_binding` too: Npgsql has no such keyword and negotiates
      # SCRAM channel binding on its own.
      #
      # Use Neon's DIRECT endpoint (NOT the "-pooler" host) while numInstances is
      # 1: this process applies EF migrations at startup, and Neon's pooled
      # endpoint runs PgBouncer in transaction mode, which is the wrong place to
      # be issuing DDL. One instance serving one clinic does not need pooling.
      # Revisit — pooled endpoint, migrations moved to a release step — only if
      # the service ever scales past one instance.
      - key: Database__ConnectionString
        sync: false

      # Same mechanism as on-premise (ADR-0019 / STD-BE-041). Safe only while
      # numInstances is 1 — see above.
      - key: Database__ApplyMigrationsAtStartup
        value: "true"

      # Explicit even though false is the default: the pilot database must never
      # receive development seed rows (PRS-Q-04).
      - key: Database__SeedDevelopmentDataAtStartup
        value: "false"

      # The access-token signing key (ADR-0022 §7, REQ-IDN-003). The app REFUSES
      # TO BOOT without it, deliberately: a predictable signing key would let
      # anyone mint a token for any tenant, which defeats every isolation
      # guarantee in ADR-0022 at once. Refusing is the safe failure — and it is
      # what stopped the first deploy of this Epic.
      #
      # `generateValue` has Render create a strong random secret and store it on
      # the service. It is never committed, never printed, and never passes
      # through a transcript — which matters here, because a live credential
      # pasted into one is already an open item from the sixteenth cycle.
      #
      # Rotating it invalidates every issued token: with a 12-hour lifetime and
      # no refresh (DEC-IDN-003/009), everyone signs in again. That is the whole
      # cost, and it is acceptable — but it is why this is not rotated casually.
      - key: Jwt__SigningKey
        generateValue: true

      # BR-INV-060: the clinic's local date comes from ONE configured zone and
      # must never fall back to UTC — the clock throws if it cannot resolve one.
      # Since DEC-ORG-007 the running source is the TENANT's zone; this value is
      # what the first clinic is seeded with, and it still refuses to boot when
      # absent or unresolvable. The Debian-based runtime image carries tzdata; an
      # Alpine base would break this at startup (ADR-0021 §Consequences 8).
      - key: Clinic__TimeZone
        value: Africa/Cairo
